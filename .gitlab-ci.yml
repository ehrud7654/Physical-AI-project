stages:
  - backend
  - frontend
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "ci/runner-setup"'
    - when: never

default:
  tags:
    - ec2-ci

build_backend:
  stage: backend
  image: docker:cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "1"
  script:
    - docker version
    - docker build --progress=plain
      --tag "ssafy-ci-backend:${CI_PIPELINE_ID}"
      --file BE/EC2_/Dockerfile
      BE/EC2_

build_frontend:
  stage: frontend
  image: docker:cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "1"
  script:
    - docker version
    - docker build --progress=plain
      --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1
      --tag "ssafy-ci-frontend:${CI_PIPELINE_ID}"
      --file FE/Dockerfile
      FE

deploy_ec2:
  stage: deploy
  image: alpine:3.22
  resource_group: ec2-production
  environment:
    name: production
  when: manual
  allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      : "${DEPLOY_USER:?EC2_USER is missing or empty}"
      : "${DEPLOY_HOST:?EC2_HOST is missing or empty}"
      : "${EC2_DEPLOY_PATH:?EC2_DEPLOY_PATH is missing or empty}"

      case "$EC2_USER" in
        *[!a-zA-Z0-9_-]*)
          echo "EC2_USER must be a Linux username"
          exit 1
          ;;
      esac

      case "$EC2_HOST" in
        -*|*[!a-zA-Z0-9.-]*)
          echo "EC2_HOST must be a hostname or IPv4 address without protocol, port or spaces"
          exit 1
          ;;
      esac

      echo "SSH destination variables validated"

      ssh \
        -o BatchMode=yes \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o ConnectTimeout=15 \
        -i ~/.ssh/id_ed25519 \
        -l "$EC2_USER" \
        "$EC2_HOST" \
        "bash '${EC2_DEPLOY_PATH}/deploy-local.sh' '${CI_PIPELINE_ID}'"
