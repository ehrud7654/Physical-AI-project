services:
  gpu-backend:
    image: ssafy-gpu-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081

      EC2_API_BASE_URL: ${EC2_API_BASE_URL:-https://j15a103.p.ssafy.io}
      GPU_WORKER_ID: ${GPU_WORKER_ID:-ssafy_gpu_laptop_01}
      GPU_NODE_KEY: ${GPU_NODE_KEY:-gpu-laptop-local-cache}
      GPU_NODE_NAME: ${GPU_NODE_NAME:-SSAFY GPU Laptop Worker}
      GPU_STORAGE_ROOT: /data/ssafy-gpu
      GPU_SUPPORTED_ALGORITHMS: ${GPU_SUPPORTED_ALGORITHMS:-ACT}
      GPU_MAX_SLOTS: ${GPU_MAX_SLOTS:-1}

      FASTAPI_BASE_URL: http://training-api:8000
      FASTAPI_SERVICE_TOKEN: ${FASTAPI_SERVICE_TOKEN:-local-fastapi-token}
      FASTAPI_CALLBACK_TOKEN: ${GPU_SPRING_CALLBACK_TOKEN:-local-callback-token}
      GPU_SHARED_STORAGE_ROOT: /data/ssafy-gpu
    volumes:
      - gpu_data:/data/ssafy-gpu
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      gpu-backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  training-api:
    image: ssafy-gpu-fastapi:local
    build:
      context: ./FastAPI_
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FASTAPI_SERVICE_TOKEN: ${FASTAPI_SERVICE_TOKEN:-local-fastapi-token}
      GPU_SPRING_BASE_URL: http://gpu-backend:8081
      GPU_SPRING_CALLBACK_TOKEN: ${GPU_SPRING_CALLBACK_TOKEN:-local-callback-token}
      WORKER_ID: ${GPU_WORKER_ID:-ssafy_gpu_laptop_01}
      STORAGE_NODE_ID: ${STORAGE_NODE_ID:-18000000-0000-4000-8000-000000000002}
      SHARED_STORAGE_ROOT: /data/ssafy-gpu
      RUN_JOURNAL_ROOT: /data/ssafy-gpu/journal/training-runs
      # The laptop has one NVIDIA GPU (host index 0), exposed as CUDA device 0.
      GPU_COUNT: 1
      CUDA_VISIBLE_DEVICES: 0
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TRAINING_COMMAND_DURATION_SECONDS: ${TRAINING_COMMAND_DURATION_SECONDS:-5}
    volumes:
      - gpu_data:/data/ssafy-gpu
      - model_cache:/home/fastapi/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Simulation and training share the only GPU assigned to this project.
  # Start this profile only after pausing training-api workloads:
  # docker compose --profile simulation up -d simulation-worker
  simulation-worker:
    image: ${SIMULATION_WORKER_IMAGE:-ssafy-simulation-worker:local}
    profiles: ["simulation"]
    environment:
      CUDA_VISIBLE_DEVICES: 0
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      SHARED_STORAGE_ROOT: /data/ssafy-gpu
    volumes:
      - gpu_data:/data/ssafy-gpu
      - model_cache:/root/.cache
      - simulation_output:/data/ssafy-gpu/simulation-output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    restart: "no"

  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE:-nvcr.io/nvidia/k8s/dcgm-exporter:latest}
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${DCGM_EXPORTER_PORT:-9400}:9400"
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9400/metrics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  gpu_data:
  model_cache:
  simulation_output:
