spring.application.name=ssafy_gpu
server.port=${SERVER_PORT:8081}

app.ec2-api.base-url=${EC2_API_BASE_URL:http://localhost}
app.ec2-api.connect-timeout=${EC2_CONNECT_TIMEOUT:3s}
app.ec2-api.read-timeout=${EC2_READ_TIMEOUT:15s}

app.worker.worker-id=${GPU_WORKER_ID:ssafy_gpu_01}
app.worker.node-key=${GPU_NODE_KEY:gpu-01-local-cache}
app.worker.node-name=${GPU_NODE_NAME:SSAFY GPU Worker}
app.worker.storage-root=${GPU_STORAGE_ROOT:./data}
app.worker.supported-algorithms=${GPU_SUPPORTED_ALGORITHMS:ACT}
app.worker.max-gpu-slots=${GPU_MAX_SLOTS:30}
app.worker.storage-heartbeat-interval=${GPU_STORAGE_HEARTBEAT_INTERVAL:15s}

management.endpoints.web.exposure.include=health,info
