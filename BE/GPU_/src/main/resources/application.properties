spring.application.name=ssafy_gpu
server.port=${SERVER_PORT:8081}

app.ec2-api.base-url=${EC2_API_BASE_URL:http://localhost}
app.ec2-api.connect-timeout=${EC2_CONNECT_TIMEOUT:3s}
app.ec2-api.read-timeout=${EC2_READ_TIMEOUT:15s}

app.worker.worker-id=${GPU_WORKER_ID:ssafy_gpu_01}
app.worker.node-key=${GPU_NODE_KEY:gpu-01-local-cache}
app.worker.node-name=${GPU_NODE_NAME:SSAFY GPU Worker}
app.worker.storage-root=${GPU_STORAGE_ROOT:./data}
app.worker.max-gpu-slots=${GPU_MAX_SLOTS:30}
app.worker.storage-heartbeat-interval=${GPU_STORAGE_HEARTBEAT_INTERVAL:15s}
app.worker.claim-polling-enabled=${GPU_CLAIM_POLLING_ENABLED:true}
app.worker.claim-polling-initial-delay=${GPU_CLAIM_POLLING_INITIAL_DELAY:20s}
app.worker.claim-polling-interval=${GPU_CLAIM_POLLING_INTERVAL:5s}
app.worker.claim-available-memory-mib=${GPU_CLAIM_AVAILABLE_MEMORY_MIB:32768}
app.worker.git-revision=${GPU_GIT_REVISION:unknown}
app.worker.event-retry-interval=${GPU_EVENT_RETRY_INTERVAL:10s}
app.worker.recovery-initial-delay=${GPU_RECOVERY_INITIAL_DELAY:10s}
app.worker.recovery-retry-interval=${GPU_RECOVERY_RETRY_INTERVAL:10s}

app.fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
app.fastapi.service-token=${FASTAPI_SERVICE_TOKEN:local-fastapi-token}
app.fastapi.callback-token=${FASTAPI_CALLBACK_TOKEN:local-callback-token}
app.fastapi.connect-timeout=${FASTAPI_CONNECT_TIMEOUT:3s}
app.fastapi.read-timeout=${FASTAPI_READ_TIMEOUT:15s}
app.fastapi.monitor-interval=${FASTAPI_MONITOR_INTERVAL:2s}
app.checkpoint-upload.content-type=${CHECKPOINT_CONTENT_TYPE:application/octet-stream}
app.checkpoint-upload.request-timeout=${CHECKPOINT_UPLOAD_TIMEOUT:10m}
app.checkpoint-upload.max-attempts=${CHECKPOINT_UPLOAD_MAX_ATTEMPTS:3}
app.gpu.shared-storage-root=${GPU_SHARED_STORAGE_ROOT:./data}
app.training-cleanup.enabled=${GPU_TRAINING_CLEANUP_ENABLED:true}
app.training-cleanup.orphan-grace-period=${GPU_ORPHAN_GRACE_PERIOD:24h}
app.training-cleanup.scan-interval=${GPU_CLEANUP_SCAN_INTERVAL:1h}

app.umi-preprocessor.base-url=${UMI_PREPROCESSOR_BASE_URL:http://localhost:18181}
app.umi-preprocessor.connect-timeout=${UMI_PREPROCESSOR_CONNECT_TIMEOUT:3s}
app.umi-preprocessor.read-timeout=${UMI_PREPROCESSOR_READ_TIMEOUT:30s}
app.umi-preprocessor.poll-interval=${UMI_PREPROCESSOR_POLL_INTERVAL:2s}
app.umi-preprocessor.processing-timeout=${UMI_PREPROCESSOR_TIMEOUT:30m}
app.umi-preprocessor.calibration-profile=${UMI_PREPROCESSOR_CALIBRATION_PROFILE:s22_20260921}
app.umi-preprocessor.require-mapping=${UMI_PREPROCESSOR_REQUIRE_MAPPING:true}
app.umi-preprocessor.max-archive-entries=${UMI_PREPROCESSOR_MAX_ARCHIVE_ENTRIES:64}
app.umi-preprocessor.max-extracted-bytes=${UMI_PREPROCESSOR_MAX_EXTRACTED_BYTES:2147483648}

management.endpoints.web.exposure.include=health,info
