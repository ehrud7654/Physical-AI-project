# 통합 테스트 전용 설정. 기존 EC2 개발 컨테이너 접속 정보는 SharedTestContainers가 주입한다.
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Outbox scheduler는 테스트가 직접 claim/publish를 호출하므로 비활성화
app.outbox.enabled=false
app.outbox.publisher-id=test-publisher

# Redis key prefix: test:ssafy:*
app.redis.environment=test
