spring.application.name=ssafy
app.aws.profile=${AWS_PROFILE:personal-s3}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# DB 초기화는 Flyway로 통일
spring.sql.init.mode=never

# JWT access tokens backed by Redis login sessions. Production must override JWT_SECRET.
app.auth.jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-key}
app.auth.jwt.issuer=${JWT_ISSUER:ssafy-api}
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.episode-storage.bucket=${S3_BUCKET_NAME:local-episode-bucket}
app.episode-storage.region=${AWS_REGION:ap-northeast-2}
app.episode-storage.presign-ttl=${EPISODE_PRESIGN_TTL:15m}
app.episode-storage.max-upload-bytes=${EPISODE_MAX_UPLOAD_BYTES:16777216}
app.checkpoint-storage.bucket=${S3_BUCKET_NAME:local-episode-bucket}
app.checkpoint-storage.presign-ttl=${CHECKPOINT_PRESIGN_TTL:15m}
app.training-worker.lease-duration=${TRAINING_LEASE_DURATION:60s}
app.training-worker.heartbeat-interval-seconds=${TRAINING_HEARTBEAT_INTERVAL_SECONDS:15}
app.training-allocation.max-active-jobs-per-worker=${TRAINING_MAX_ACTIVE_JOBS_PER_WORKER:30}
app.training-allocation.min-available-storage-bytes=${TRAINING_MIN_AVAILABLE_STORAGE_BYTES:1073741824}
app.training-allocation.min-available-memory-mib=${TRAINING_MIN_AVAILABLE_MEMORY_MIB:4096}
app.training-allocation.max-attempts=${TRAINING_MAX_ATTEMPTS:3}
app.training-allocation.recovery-interval=${TRAINING_RECOVERY_INTERVAL:30s}
app.training-allocation.storage-node-offline-after=${STORAGE_NODE_OFFLINE_AFTER:45s}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.publisher-id=${HOSTNAME:local-publisher}
app.outbox.fixed-delay=1s
app.outbox.lease-duration=30s
app.outbox.batch-size=50
app.outbox.max-attempts=10
app.outbox.retention=30d
app.outbox.sse-max-length=500
app.outbox.sse-ttl=10m

app.deployment.pending-timeout=${DEPLOYMENT_PENDING_TIMEOUT:30s}
app.deployment.timeout-scan-interval=${DEPLOYMENT_TIMEOUT_SCAN_INTERVAL:5s}

# Redis TTL (RedisTtlProperties: 모두 양수 필수)
app.redis.ttl.session=30d
app.redis.ttl.training-lease=60s
app.redis.ttl.purge-lease=60s
app.redis.ttl.device-presence=45s
app.redis.ttl.sse-event=10m
app.redis.ttl.idempotency=10m
app.redis.ttl.rate-limit=1m
app.device-enrollment.ttl=${DEVICE_ENROLLMENT_TTL:10m}
app.device-enrollment.max-attempts=${DEVICE_ENROLLMENT_MAX_ATTEMPTS:5}
