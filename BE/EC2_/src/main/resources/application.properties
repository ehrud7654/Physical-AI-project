spring.application.name=ssafy

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# DB 초기화는 Flyway로 통일
spring.sql.init.mode=never

# Redis defaults shared by every environment; endpoints are overridden per profile.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=1s
management.endpoint.health.show-details=never
management.health.redis.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=db
app.redis.ttl.session=30d
app.redis.ttl.training-lease=60s
app.redis.ttl.purge-lease=60s
app.redis.ttl.training-profile=10m
app.redis.ttl.device-presence=45s
app.redis.ttl.sse-event=10m
app.redis.ttl.idempotency=10m
app.redis.ttl.rate-limit=1m
